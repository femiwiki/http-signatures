---
# GitHub starts no workflows for a pull request GITHUB_TOKEN opens, so the
# release pull request is opened as the femiwiki-pat-owner app to get its
# checks like any other.
name: Release Please
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.PAT_APPLICATION_CLIENT_ID }}
          private-key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
