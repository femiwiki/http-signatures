---
name: Required
on:
  push:
    branches: [main]
  pull_request:
# A new commit on a pull request cancels the run on its old commit; runs on
# main each get a group of their own and are never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ case(github.event_name == 'pull_request',
    github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - run: composer install --no-interaction --no-progress
      - run: composer test

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@30a15e0ace6fb2bf70dff4d04b4276404a3d10b6
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # jobs above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [test, shared-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
