---
name: Required
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - run: composer install --no-interaction --no-progress
      - run: composer test

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@329850458d9df0a2383e7a4e2243751ee823c0d4
    permissions:
      contents: read

  # The one check branch protection requires. What has to pass is the
  # jobs above, so adding a check does not touch femiwiki/infra.
  required:
    needs: [test, shared-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job above passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
